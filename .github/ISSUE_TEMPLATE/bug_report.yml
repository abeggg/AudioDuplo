name: Problema de áudio ou interface
description: Relate um defeito com passos para reproduzir.
title: '[Bug] '
body:
  - type: input
    id: version
    attributes:
      label: Versão do AudioDuplo e do Windows
      placeholder: 'AudioDuplo 1.1.4 / Windows 11 24H2'
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Dispositivos e conexões
      description: Informe modelos, USB/P2/Bluetooth e o buffer escolhido. Não inclua IDs ou dados pessoais.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: O que esperava, o que aconteceu e quais passos levam ao problema?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico opcional
      description: Use o botão Diagnóstico e revise os nomes dos dispositivos antes de colar.
      render: text
