name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check release version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'v1.1.4') {
            throw 'Update the application, resources, package version and release guard before creating a new version.'
          }
      - name: Build, test and package
        shell: pwsh
        run: ./scripts/Build.ps1 -Package
      - name: Create draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME `
            build/AudioDuplo-1.1.4-windows-x64.zip build/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY --verify-tag --draft `
            --title "AudioDuplo $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the draft release.' }
